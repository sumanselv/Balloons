                var pf=puffs[pu]; pf.life-=dt*0.9; pf.x+=pf.vx*dt; pf.y+=pf.vy*dt; pf.r+=dt*14;
                if(pf.life<=0){puffs.splice(pu,1);continue;}
                g.fillStyle=pf.life>0.85?'rgba(255,170,60,0.7)':'rgba(240,240,245,'+(0.55*pf.life).toFixed(2)+')';
                g.beginPath(); g.arc(pf.x,pf.y,pf.r,0,6.2832); g.fill();
            }
            for(var ri=rockets.length-1;ri>=0;ri--){
                var rk=rockets[ri]; rk.vy=Math.min(430,rk.vy+150*dt); rk.y-=rk.vy*dt; rk.x+=Math.sin(t*1.6+rk.ph)*14*dt;
                if(rk.y<-140){rockets.splice(ri,1);continue;}
                puffs.push({x:rk.x+rnd(-4,4),y:rk.y+50,vx:rnd(-12,12),vy:rnd(40,90),r:rnd(5,9),life:1});
                puffs.push({x:rk.x+rnd(-6,6),y:rk.y+58,vx:rnd(-16,16),vy:rnd(50,100),r:rnd(5,9),life:1});
                drawRocket(rk,t);
            }
            rainT-=dt;
            if(rainT<=0&&el>=UNL.rain){ rainOn=!rainOn; if(rainOn){ rainT=rnd(25,35); } else { rainT=rnd(120,200); rbT=20; rbX=rnd(0.3,0.7); } }
            rainAmt+=((rainOn?1:0)-rainAmt)*Math.min(1,dt*0.7);
            if(rainAmt>0.01){
                g.fillStyle='rgba(110,122,145,'+(0.16*rainAmt).toFixed(3)+')'; g.fillRect(0,0,W,H);
                var want=rainAmt*W*H/7000, add=0;
                while(drops.length<want&&add<14){ drops.push({x:rnd(-100,W+50),y:rnd(-60,0),v:rnd(620,900)}); add++; }
                g.strokeStyle='rgba(80,110,165,.5)'; g.lineWidth=1.4; g.lineCap='round'; g.beginPath();
                for(var di=drops.length-1;di>=0;di--){
                    var dr=drops[di]; dr.y+=dr.v*dt; dr.x+=70*dt;
                    if(dr.y>H+20){drops.splice(di,1);continue;}
                    g.moveTo(dr.x-2.1,dr.y-dr.v*0.03); g.lineTo(dr.x,dr.y);
                }
                g.stroke();
            } else if(drops.length){ drops.length=0; }
            spawnT-=dt;
            bugT-=dt; if(bugT<=0){ if(fliers.length<8) spawnBug(); bugT=rnd(4,10); }
            if(balloons.length<target()&&spawnT<=0){spawn(false);spawnT=rnd(0.25,0.8);}
            for(var i=balloons.length-1;i>=0;i--){
                var b=balloons[i]; b.y-=b.vy*dt; b.ox=Math.sin(t*b.sp+b.ph)*b.amp;
                if(b.y<-b.ry*2-90) balloons.splice(i,1);
            }
            interact(dt);
            hoverCheck();
            balloons.forEach(function(b){drawBalloon(b,t);});
            bubT-=dt;
            if(bubT<=0&&el>=UNL.bubbles&&bubbles.length<Math.max(6,Math.min(18,Math.round(W/70)))){ var br=rnd(10,30); bubbles.push({x:rnd(br,W-br),y:H+br+rnd(0,40),r:br,vy:rnd(40,95),ph:rnd(0,6.28),amp:rnd(10,26),sp:rnd(0.9,1.8),ox:0}); bubT=rnd(0.3,0.9); }
            for(var bu=bubbles.length-1;bu>=0;bu--){
                var bb=bubbles[bu]; bb.y-=bb.vy*dt; bb.ox=Math.sin(t*bb.sp+bb.ph)*bb.amp;
                if(bb.y<-bb.r*2-40){bubbles.splice(bu,1);continue;}
                var bx=bb.x+bb.ox, by=bb.y, r2=bb.r, bg=g.createRadialGradient(bx-r2*0.3,by-r2*0.3,r2*0.1,bx,by,r2);
                bg.addColorStop(0,'rgba(255,255,255,0.25)'); bg.addColorStop(0.7,'rgba(190,225,255,0.10)'); bg.addColorStop(1,'rgba(160,200,255,0.30)');
                g.fillStyle=bg; g.beginPath(); g.arc(bx,by,r2,0,6.2832); g.fill();
                g.strokeStyle='rgba(120,175,255,0.55)'; g.lineWidth=1.5; g.beginPath(); g.arc(bx,by,r2,0,6.2832); g.stroke();
                g.strokeStyle='rgba(255,140,200,0.3)'; g.lineWidth=1; g.beginPath(); g.arc(bx,by,r2*0.86,0.4,1.8); g.stroke();
                g.strokeStyle='rgba(255,255,255,0.85)'; g.lineWidth=2; g.lineCap='round'; g.beginPath(); g.arc(bx,by,r2*0.7,3.5,4.5); g.stroke();
            }
            for(var q2=fliers.length-1;q2>=0;q2--){
                var f=fliers[q2]; if(f.wait>0){f.wait-=dt;continue;}
                f.t+=dt;
                var fsp=f.type==='dragonfly'?(f.mode==='around'?170:260):f.type==='bee'?190:f.type==='bird'?170:f.type==='parrot'?180:f.type==='peacock'?115:f.type==='butterfly'?95*(0.75+0.45*Math.sin(f.t*6+f.ph)):(f.amb?130:120+f.t*45);
                var trn=f.type==='bee'?Math.sin(f.t*7+f.ph)*3.2:f.type==='dragonfly'?Math.sin(f.t*2+f.ph)*0.5+(f.mode==='around'?Math.sin(f.t*3.3+f.ph*2)*1.6:0):f.type==='bird'?Math.sin(f.t*1.5+f.ph)*0.3:f.type==='parrot'?Math.sin(f.t*1.7+f.ph)*0.35:f.type==='peacock'?Math.sin(f.t*1.8+f.ph)*0.9+Math.sin(f.t*3.1+f.ph*2)*0.5:f.type==='butterfly'?Math.sin(f.t*3+f.ph)*1.7+Math.sin(f.t*5.3+f.ph*2)*1.3:Math.sin(f.t*3+f.ph)*1.2;
                var steer=f.amb?0:Math.sin(-1.5708-f.hd)*0.9;
                if(f.amb&&f.mode==='around'){
                    var tgt=f.t<18?Math.atan2(H/2-f.y,W/2-f.x):Math.atan2(f.y-H/2,f.x-W/2), edge=f.x<W*0.12||f.x>W*0.88||f.y<H*0.12||f.y>H*0.88;
                    if(f.t>=18||edge) steer=Math.sin(tgt-f.hd)*(f.type==='dragonfly'?2.6:1.6);
                }
                f.hd+=(trn+steer)*dt;
                f.x+=Math.cos(f.hd)*fsp*dt; f.y+=Math.sin(f.hd)*fsp*dt;
                if(f.x<-90||f.x>W+90||f.y<-90||f.y>H+90||f.t>(f.amb?60:f.type==='butterfly'?20:10)){fliers.splice(q2,1);continue;}
                g.save(); g.translate(f.x,f.y); g.rotate(f.hd+1.5708); drawBug(f.type,f.s,true,f.t,f.pal); g.restore();
            }
            leafT-=dt;
            if(leafT<=0&&el>=UNL.leaves&&leaves.length<14){ leaves.push({x:-30,y:rnd(H*0.05,H*0.92),vx:rnd(90,210),fy:rnd(8,30),rot:rnd(0,6.28),vr:rnd(-3,3),s:rnd(9,16),ph:rnd(0,6.28),c:LEAF[Math.floor(Math.random()*LEAF.length)]}); leafT=rnd(1.2,3.5); }
            for(var li=leaves.length-1;li>=0;li--){
                var lf=leaves[li]; lf.x+=lf.vx*dt; lf.y+=(lf.fy+Math.sin(t*1.8+lf.ph)*45)*dt; lf.rot+=lf.vr*dt;
                if(lf.x>W+40||lf.y>H+40){leaves.splice(li,1);continue;}
                g.save(); g.translate(lf.x,lf.y); g.rotate(lf.rot); g.scale(0.35+0.65*Math.abs(Math.cos(t*2.2+lf.ph)),1);
                g.fillStyle=lf.c; g.beginPath(); g.moveTo(0,-lf.s); g.quadraticCurveTo(lf.s*0.95,-lf.s*0.2,0,lf.s); g.quadraticCurveTo(-lf.s*0.95,-lf.s*0.2,0,-lf.s); g.fill();
                g.strokeStyle='rgba(0,0,0,.28)'; g.lineWidth=1; g.beginPath(); g.moveTo(0,-lf.s*0.85); g.lineTo(0,lf.s*1.25); g.stroke();
                g.restore();
            }
            for(var j=rings.length-1;j>=0;j--){
                var r=rings[j]; r.life-=dt*3.2; r.r+=dt*260;
                if(r.life<=0){rings.splice(j,1);continue;}
                g.strokeStyle=mix(r.c,255,0.2); g.globalAlpha=r.life*0.6; g.lineWidth=3*r.life+0.5;
                g.beginPath(); g.arc(r.x,r.y,r.r,0,6.2832); g.stroke(); g.globalAlpha=1;
            }
            g.textAlign='center'; g.textBaseline='middle';
            for(var m=words.length-1;m>=0;m--){
                var w=words[m]; w.life-=dt*(w.q?0.14:0.5); w.y-=(w.q?0:45)*dt;
                if(w.life<=0){words.splice(m,1);continue;}
                if(w.q){drawQuote(w);continue;}
                g.font='400 '+w.s+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
                var tw=g.measureText(w.t).width, wx=Math.max(tw/2+10,Math.min(W-tw/2-10,w.x)), wy=Math.max(50,w.y), sc=1;
                g.save(); g.globalAlpha=Math.min(1,w.life*2.2); g.translate(wx,wy); g.scale(sc,sc);

                g.fillStyle='#333'; g.fillText(w.t,0,0); g.restore();
            }
            newsT-=dt; if(newsT<=0&&el>=UNL.news){ if(!news.length) spawnNews5(); newsT=rnd(10,20); }
            for(var ni=news.length-1;ni>=0;ni--){
                var nw=news[ni]; nw.t+=dt;
                var gone=drawNews5(nw);
                if(gone){news.splice(ni,1);continue;}

            }
            for(var k=parts.length-1;k>=0;k--){
                var q=parts[k]; q.life-=dt*1.6;
                if(q.life<=0){parts.splice(k,1);continue;}
                q.vy+=700*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.985; q.rot+=q.vr*dt;
                g.save(); g.globalAlpha=Math.min(1,q.life*1.6); g.translate(q.x,q.y); g.rotate(q.rot);
                g.fillStyle=mix(q.c,0,0.1); g.fillRect(-q.s/2,-q.s/4,q.s,q.s/2); g.restore();
            }
            requestAnimationFrame(frame);
        }

        addEventListener('resize',resize);
        resize();
        for(var n=0;n<target();n++)spawn(true);
        for(var cn=0;cn<4;cn++)newCloud(true);
        if(document.fonts&&document.fonts.load){ document.fonts.load('400 24px Kalam'); document.fonts.load('600 26px Caveat'); }
        for(var si0=0;si0<140;si0++) stars.push({fx:Math.random(),fy:Math.random()*0.78,r:rnd(0.6,1.9),ph:rnd(0,6.28),sp:rnd(1,3)});
        for(var fi0=0,fn=Math.max(10,Math.min(26,Math.round(W/65)));fi0<fn;fi0++) flies.push({fx:rnd(0.03,0.97),fy:rnd(0.5,0.95),ph:rnd(0,6.28),sp:rnd(0.7,1.3),bp:rnd(0,6.28),bs:rnd(1.2,2.6)});
        for(var kn=0,kc=Math.max(2,Math.min(4,Math.round(W/380)));kn<kc;kn++){ var kp=PALS[Math.floor(Math.random()*PALS.length)]; kites.push({fx:(kn+0.5+rnd(-0.25,0.25))/kc,fy:rnd(0.15,0.45),fa:rnd(0.1,0.9),s:rnd(26,38),ph:rnd(0,6.28),c1:kp[0],c2:kp[1]}); }
        requestAnimationFrame(frame);
    })();
</script>
</body>
</html>
